[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-monitor-sdk"
version = "0.1.0"
description = "Cloud monitoring SDK for Python MCP servers"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "MCP Monitor" }]
dependencies = [
  "mcp>=1.2.0,<2",
  "httpx>=0.27.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_monitor_sdk"]

[tool.hatch.build.targets.sdist]
include = ["src/mcp_monitor_sdk", "README.md", "USER.md", "DEV.md"]
