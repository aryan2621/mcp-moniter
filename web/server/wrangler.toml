name = "mcp-metrics-server"
compatibility_date = "2024-03-14"
compatibility_flags = ["nodejs_compat"]
main = "src/index.ts"

# Non-secret env (secrets: POSTGRES_URL, INFLUX_TOKEN, CLERK_SECRET_KEY via `wrangler secret put`)
[vars]
INFLUX_URL = "https://us-east-1-1.aws.cloud2.influxdata.com"
INFLUX_ORG = "Dev Team"
INFLUX_BUCKET = "mcp-metrics"
NODE_ENV = "production"
LOG_LEVEL = "info"
